name: Testes de API

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir a API ServeRest localmente
        run: |
          npx -y serverest@latest > serverest.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/usuarios > /dev/null && echo "ServeRest no ar" && exit 0
            sleep 2
          done
          echo "ServeRest não subiu" && cat serverest.log && exit 1

      - name: Executar os testes
        run: mvn -B test -DbaseUrl=http://localhost:3000

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/cucumber-report.html
            target/surefire-reports/
